name: TradeCore CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION:      af-south-1
  ECR_REPOSITORY:  tradecore-api

jobs:
  # ── Test ───────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB:       tradecore_test
          POSTGRES_USER:     tradecore
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tradecore/backend/package-lock.json

      - name: Install dependencies
        run:  npm ci
        working-directory: tradecore/backend/

      - name: Run schema migration
        run: psql postgresql://tradecore:test_password@localhost:5432/tradecore_test -f tradecore/database/schema.sql

      - name: Run tests
        run:  npm test
        working-directory: tradecore/backend/
        env:
          NODE_ENV:    test
          DB_HOST:     localhost
          DB_PORT:     5432
          DB_NAME:     tradecore_test
          DB_USER:     tradecore
          DB_PASSWORD: test_password
          JWT_SECRET:  test_secret_not_for_production

  # ── Build frontend ─────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tradecore/frontend/package-lock.json

      - name: Install & build
        working-directory: tradecore/frontend/
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ secrets.API_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: tradecore/frontend/dist

  # ── Build & push API image ─────────────────────────────────────────
  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: build
        working-directory: tradecore/backend/
        env:
          REGISTRY:  ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag  $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $REGISTRY/$ECR_REPOSITORY:latest
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ── Deploy to staging (auto on develop) ───────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [build-api, build-frontend]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Deploy API to ECS staging
        run: |
          aws ecs update-service \
            --cluster tradecore-staging \
            --service tradecore-api-staging \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Deploy frontend to Amplify staging
        run: |
          aws amplify start-deployment \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --branch-name staging \
            --region ${{ env.AWS_REGION }}

      - name: Smoke test staging
        run: |
          sleep 30
          curl -f ${{ secrets.STAGING_URL }}/health || exit 1

  # ── Deploy to production (manual approval on main) ─────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [build-api, build-frontend]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url:  ${{ secrets.PROD_URL }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Deploy API to ECS production
        run: |
          aws ecs update-service \
            --cluster tradecore-production \
            --service tradecore-api-production \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Deploy frontend to Amplify production
        run: |
          aws amplify start-deployment \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --branch-name main \
            --region ${{ env.AWS_REGION }}

      - name: Smoke test production
        run: |
          sleep 60
          curl -f ${{ secrets.PROD_URL }}/health || exit 1

      - name: Notify Slack
        if: always()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d '{"text":"TradeCore production deploy ${{ job.status }} — version ${{ github.sha }}"}'
